---
# Kubernetes Setup and Configuration Tasks



# 2. Container Runtime (containerd)
- name: Install containerd
  apt:
    name: containerd
    state: present

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Configure containerd with SystemdCgroup
  template:
    src: containerd_config.toml.j2
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify: Restart containerd

# 設定変更があった場合のみ再起動する。kubeadm init より前に設定を反映させるため、ここで実行する。
- name: Flush handlers to apply containerd config
  meta: flush_handlers

- name: Enable and start containerd service
  service:
    name: containerd
    state: started
    enabled: yes

# 3. Kubernetes Repository and Components Installation
- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Kubernetes GPG key
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: '0644'
  check_mode: no

- name: De-armor Kubernetes GPG key
  command: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  check_mode: no

- name: Add Kubernetes APT repository
  copy:
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: '0644'
  check_mode: no

- name: Update apt cache and install Kubernetes packages
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes
  ignore_errors: "{{ ansible_check_mode }}"

- name: Pin Kubernetes packages versions
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable kubelet service
  service:
    name: kubelet
    enabled: yes
  when: not ansible_check_mode

# 4. Initialize Kubernetes Cluster
- name: Check if Kubernetes is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_init_check

- name: Generate kubeadm initialization configuration file
  template:
    src: kubeadm_config.yaml.j2
    dest: /tmp/kubeadm_config.yaml
    mode: '0640'
  when: not k8s_init_check.stat.exists

- name: Initialize Kubernetes cluster via kubeadm
  command: kubeadm init --config /tmp/kubeadm_config.yaml
  register: kubeadm_init_output
  when: not k8s_init_check.stat.exists
  changed_when: true

# 5. Configure Kubeconfig for user seiya
- name: Create .kube directory for seiya
  file:
    path: /home/seiya/.kube
    state: directory
    owner: seiya
    group: seiya
    mode: '0755'

- name: Copy kubeconfig to seiya's home
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/seiya/.kube/config
    owner: seiya
    group: seiya
    mode: '0600'
    remote_src: yes
  when: not ansible_check_mode

# 6. Deploy Add-ons
# kubernetes.core.k8s モジュールで適用する。冪等性はモジュールが実クラスタとの差分で判定するため、
# kubectl の標準出力の文字列一致による changed_when は使わない。
# モジュールは対象ホスト上で python3-kubernetes を使って動作する。
- name: Install python3-kubernetes for kubernetes.core modules
  apt:
    name: python3-kubernetes
    state: present
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check if kubeconfig exists for seiya
  stat:
    path: /home/seiya/.kube/config
  register: kubeconfig_check

- name: Wait for API Server to become healthy
  become_user: seiya
  command: kubectl get --raw /readyz
  register: apiserver_ready
  until: apiserver_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  when: not k8s_init_check.stat.exists and not ansible_check_mode

- name: Deploy add-ons
  become_user: seiya
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: /home/seiya/.kube/config
    kubernetes.core.k8s_info:
      kubeconfig: /home/seiya/.kube/config
    kubernetes.core.k8s_taint:
      kubeconfig: /home/seiya/.kube/config
  when: kubeconfig_check.stat.exists
  block:
    # CNI (Flannel)
    - name: Deploy Flannel network plugin
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.url', 'https://github.com/flannel-io/flannel/releases/download/' ~ flannel_version ~ '/kube-flannel.yml', split_lines=False) | from_yaml_all | select | list }}"

    # Untaint Master Node (Allow pods on Control Plane)
    - name: Get cluster nodes
      kubernetes.core.k8s_info:
        kind: Node
      register: cluster_nodes

    - name: Remove master/control-plane NoSchedule taint
      kubernetes.core.k8s_taint:
        state: absent
        name: "{{ item.metadata.name }}"
        taints:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
      loop: "{{ cluster_nodes.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    # Local Path Storage (StorageClass)
    - name: Deploy Rancher Local Path Storage Provisioner
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.url', 'https://raw.githubusercontent.com/rancher/local-path-provisioner/' ~ local_path_provisioner_version ~ '/deploy/local-path-storage.yaml', split_lines=False) | from_yaml_all | select | list }}"

    - name: Set Local Path StorageClass as default
      kubernetes.core.k8s:
        state: patched
        kind: StorageClass
        api_version: storage.k8s.io/v1
        name: local-path
        definition:
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"

    # Ingress Controller (ingress-nginx)
    # 上流マニフェストを kustomize のパッチで加工して描画する。描画は毎回上流から行うため、
    # 加工が実行のたびに累積することはない。
    - name: Create kustomize directory for ingress-nginx
      become_user: root
      file:
        path: /tmp/kustomize/ingress-nginx
        state: directory
        owner: seiya
        mode: '0755'

    - name: Generate kustomization for ingress-nginx (HostNetwork)
      become_user: root
      copy:
        dest: /tmp/kustomize/ingress-nginx/kustomization.yaml
        owner: seiya
        mode: '0644'
        content: |
          resources:
            - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-{{ ingress_nginx_version }}/deploy/static/provider/baremetal/deploy.yaml
          patches:
            - target:
                kind: Deployment
                name: ingress-nginx-controller
              patch: |-
                - op: add
                  path: /spec/template/spec/hostNetwork
                  value: true
                - op: replace
                  path: /spec/template/spec/dnsPolicy
                  value: ClusterFirstWithHostNet

    - name: Render ingress-nginx manifest
      command: kubectl kustomize /tmp/kustomize/ingress-nginx
      register: ingress_nginx_manifest
      changed_when: false
      check_mode: false

    - name: Deploy ingress-nginx Controller
      kubernetes.core.k8s:
        state: present
        definition: "{{ ingress_nginx_manifest.stdout | from_yaml_all | select | list }}"

    # cert-manager
    - name: Deploy cert-manager
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.url', 'https://github.com/cert-manager/cert-manager/releases/download/' ~ cert_manager_version ~ '/cert-manager.yaml', split_lines=False) | from_yaml_all | select | list }}"

    # Metrics Server
    - name: Create kustomize directory for Metrics Server
      become_user: root
      file:
        path: /tmp/kustomize/metrics-server
        state: directory
        owner: seiya
        mode: '0755'

    - name: Generate kustomization for Metrics Server (insecure kubelet TLS)
      become_user: root
      copy:
        dest: /tmp/kustomize/metrics-server/kustomization.yaml
        owner: seiya
        mode: '0644'
        content: |
          resources:
            - https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml
          patches:
            - target:
                kind: Deployment
                name: metrics-server
              patch: |-
                - op: add
                  path: /spec/template/spec/containers/0/args/-
                  value: --kubelet-insecure-tls

    - name: Render Metrics Server manifest
      command: kubectl kustomize /tmp/kustomize/metrics-server
      register: metrics_server_manifest
      changed_when: false
      check_mode: false

    - name: Deploy Metrics Server
      kubernetes.core.k8s:
        state: present
        definition: "{{ metrics_server_manifest.stdout | from_yaml_all | select | list }}"

    # cert-manager ClusterIssuer
    # Webhook が起動する前に適用すると検証で失敗するため、起動を待つ。
    - name: Wait for cert-manager webhook to become ready
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: cert-manager
        name: cert-manager-webhook
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180
      when: not ansible_check_mode

    - name: Deploy cert-manager ClusterIssuer
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.template', 'cluster_issuer.yaml.j2') | from_yaml_all | select | list }}"
      when: not ansible_check_mode

    # 共有Namespace・Certificate・Ingress
    # 全サービスが共有する外部公開の入口。サービスの追加・削除時は shared_ingress_routes を更新して再適用する。
    # Certificate の検証（HTTP-01）は cert-manager の Webhook が起動してから通るため、ClusterIssuer の後に適用する。
    # Ingress の検証は ingress-nginx の admission webhook を通るため、Controller の起動を待つ。
    - name: Wait for ingress-nginx controller to become ready
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: ingress-nginx
        name: ingress-nginx-controller
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180
      when: not ansible_check_mode

    - name: Deploy shared Namespace, Certificate and Ingress
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.template', 'shared_ingress.yaml.j2') | from_yaml_all | select | list }}"
      when: not ansible_check_mode

    # External Secrets Operator
    # 個人開発プロジェクト間で共有するDBパスワード等を、各プロジェクトの.envへ平文で
    # 書き写す運用をやめ、OCI Vaultを真実源としてKubernetes Secretへ同期する。
    # CRD（clustersecretstores/secretstores）のOpenAPIスキーマが大きく、通常の
    # client-side apply が付与する last-applied-configuration アノテーションが
    # Kubernetesのアノテーション上限（262144バイト）を超えるため、apply（アノテーション付与）は
    # 使わず、モジュール既定の作成・パッチで適用する。
    # external-secrets.yaml は専用Namespaceを作成せず、現在のコンテキスト
    # （このクラスタでは default）にリソースを展開する。
    - name: Deploy External Secrets Operator
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.url', 'https://github.com/external-secrets/external-secrets/releases/download/' ~ eso_version ~ '/external-secrets.yaml', split_lines=False) | from_yaml_all | select | list }}"

    - name: Wait for External Secrets Operator webhook to become ready
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: default
        name: external-secrets-webhook
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 120
      when: not ansible_check_mode

    - name: Deploy ClusterSecretStore for OCI Vault
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.template', 'vault_store.yaml.j2') | from_yaml_all | select | list }}"
      when: not ansible_check_mode
