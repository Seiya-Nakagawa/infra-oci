---

- name: Install MySQL packages and python3-pymysql
  apt:
    name:
      - mysql-server
      - mysql-client
      - python3-pymysql
    state: present

- name: Configure MySQL server mysqld.cnf
  template:
    src: mysqld.cnf.j2
    dest: /etc/mysql/mysql.conf.d/mysqld.cnf
    mode: '0640'
  register: mysql_config

- name: Create mysql.service systemd drop-in directory
  file:
    path: /etc/systemd/system/mysql.service.d
    state: directory
    mode: '0755'

# RuntimeDirectory=mysqld のデフォルト（RuntimeDirectoryPreserve=no）だと、
# mysqld再起動のたびに/var/run/mysqldがディレクトリごと再作成される（inodeが変わる）。
# Kubernetes Podのhostpathマウントが旧ディレクトリ実体を指したままになりソケット接続が
# 切れるため、再起動後もディレクトリを保持させる。
- name: Preserve mysqld runtime directory across restarts
  copy:
    content: |
      [Service]
      RuntimeDirectoryPreserve=yes
    dest: /etc/systemd/system/mysql.service.d/override.conf
    mode: '0644'
  register: mysql_runtime_dir_override
  notify:
    - reload systemd daemon
    - restart mysql

- name: Ensure MySQL service is enabled and started
  service:
    name: mysql
    state: started
    enabled: yes
  when: not ansible_check_mode

- name: Restart MySQL if config changed
  service:
    name: mysql
    state: restarted
  when: not ansible_check_mode and mysql_config.changed

- name: Remove anonymous MySQL users
  mysql_user:
    name: ""
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: not ansible_check_mode

- name: Disallow root remote login
  mysql_user:
    name: root
    host: "{{ item }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop:
    - "{{ ansible_hostname }}"
    - "127.0.0.1"
    - "::1"
  when: not ansible_check_mode

- name: Remove test database
  mysql_db:
    name: test
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: not ansible_check_mode

- name: Create application databases
  mysql_db:
    name: "{{ item.name }}"
    encoding: "{{ item.encoding }}"
    collation: "{{ item.collation }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop: "{{ mysql_databases }}"
  when: not ansible_check_mode

- name: Fetch application user passwords from OCI Vault
  ansible.builtin.command:
    cmd: >
      oci secrets secret-bundle get-secret-bundle-by-name
      --secret-name {{ item.oci_secret_name }}
      --vault-id {{ oci_vault_id }}
      --query "data.\"secret-bundle-content\".content" --raw-output
  delegate_to: localhost
  become: false
  loop: "{{ mysql_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: mysql_user_secrets
  no_log: true
  changed_when: false
  when: not ansible_check_mode

- name: Build application user password lookup
  ansible.builtin.set_fact:
    mysql_user_passwords: "{{ dict(mysql_users | map(attribute='name') | zip(mysql_user_secrets.results | map(attribute='stdout') | map('b64decode'))) }}"
  no_log: true
  when: not ansible_check_mode

# update_password: on_create を指定しないと、実行のたびに既存ユーザーのパスワードが
# OCI Vaultの値で上書きされ、DB側で運用中のパスワードと乖離した場合に接続断を起こす。
# password と plugin を同時に指定すると plugin 指定が無視され mysql_native_password で
# 作成されるため、password ではなく plugin_auth_string を使う。
- name: Create application users and grant privileges
  mysql_user:
    name: "{{ item.name }}"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ mysql_user_passwords[item.name] }}"
    priv: "{{ item.priv }}"
    host: "{{ item.host }}"
    state: present
    update_password: on_create
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop: "{{ mysql_users }}"
  no_log: true
  when: not ansible_check_mode

- name: Remove legacy seiya_db user (renamed to app-dbuser)
  mysql_user:
    name: seiya_db
    host: localhost
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: not ansible_check_mode

- name: Remove transitional shared_app user (renamed to app-dbuser)
  mysql_user:
    name: shared_app
    host: localhost
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: not ansible_check_mode
