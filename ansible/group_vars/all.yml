# OCI Portfolio Infrastructure Common Variables

# System settings
system_hostname: "oci-portfolio"
system_timezone: "Asia/Tokyo"
system_locale: "ja_JP.UTF-8"

# System limits
sysctl_parameters:
  - { name: "net.ipv4.conf.all.accept_redirects", value: 0 }
  - { name: "net.ipv4.conf.all.send_redirects", value: 0 }
  - { name: "net.ipv4.tcp_syncookies", value: 1 }
  - { name: "net.ipv6.conf.all.disable_ipv6", value: 1 }
  - { name: "kernel.randomize_va_space", value: 2 }
  - { name: "fs.file-max", value: 2097152 }
  - { name: "fs.nr_open", value: 1048576 }
  - { name: "vm.max_map_count", value: 262144 }

# Kubernetes settings
k8s_version: "1.30"

# Kubernetes アドオンのバージョン（マニフェスト URL の固定に使用）
flannel_version: "v0.28.9"
local_path_provisioner_version: "v0.0.37"
metrics_server_version: "v0.9.0"
ingress_nginx_version: "v1.10.1"
cert_manager_version: "v1.14.5"
pod_network_cidr: "10.244.0.0/16"
cert_manager_email: "aibdlnew1.work@gmail.com"

# MySQL settings
mysql_databases:
  - name: "arumono_recipe"
    encoding: "utf8mb4"
    collation: "utf8mb4_0900_ai_ci"
  - name: "kakeibo"
    encoding: "utf8mb4"
    collation: "utf8mb4_0900_ai_ci"
  - name: "portfolio"
    encoding: "utf8mb4"
    collation: "utf8mb4_0900_ai_ci"

mysql_users:
  - name: "app-dbuser"
    oci_secret_name: "app-dbuser-password"
    priv: "*.*:ALL"
    host: "localhost"
  # ダンプ専用の読み取りユーザー（全DBのダンプに必要な権限のみ）
  - name: "backup-dbuser"
    oci_secret_name: "backup-dbuser-password"
    priv: "*.*:SELECT,SHOW VIEW,TRIGGER,EVENT"
    host: "localhost"

# 全サービス共有のNamespace・Ingress・TLS証明書
# ホスト名・パスの割り当ては docs/02.design/99.appendix/ホスト名・パス割り当て台帳.md と揃える。
# 1つのIngressで全ルートを扱うため、パスは「/{path_prefix}」でマッチし、
# プレフィックスを除去してバックエンドへ転送する。
shared_namespace: "app-prod"
shared_ingress_name: "shared-ingress"
shared_ingress_host: "technohonesty.com"
shared_tls_secret_name: "technohonesty-com-tls"
shared_ingress_routes:
  - { path_prefix: "kakeibo", service_name: "kakeibo-web", service_port: 80 }
  - { path_prefix: "portfolio", service_name: "portfolio-web", service_port: 80 }

# DB バックアップ settings
# oci_cli_version はホスト上の OCI CLI（インスタンスプリンシパル用）のバージョン
oci_cli_version: "3.94.0"
backup_oci_venv: "/opt/oci-cli"
backup_secret_name: "backup-dbuser-password"
backup_db_user: "backup-dbuser"
backup_time: "03:00:00"
# backup_bucket_name / backup_namespace / backup_topic_id は terraform output から
# scripts/run_ansible.sh 経由で -e として渡される

# External Secrets Operator settings
eso_version: "v2.9.0"
eso_cluster_secret_store_name: "oci-vault"

# OCI Vault settings (oci_vault_id / oci_region / oci_compartment_ocid は
# terraform output から scripts/run_ansible.sh 経由で -e として渡される)

