[defaults]
# Vault パスワードファイル。run_ansible.sh は ansible/ へ移動してから
# ansible-playbook を実行するため、本ファイルと同ディレクトリの相対パスで解決される。
# 実体は Git 管理外（.gitignore）のため、各自でローカルに配置する。
vault_password_file = .vault_password

# 既定のインベントリ。run_ansible.sh は -i で明示的に指定するが、
# ansible-playbook を直接実行する場合の既定値として設定する。
inventory = hosts.yml

interpreter_python = auto_silent
retry_files_enabled = False
